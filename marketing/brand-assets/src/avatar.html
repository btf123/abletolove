<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  html{background:linear-gradient(140deg,#E91E63 0%,#C2185B 55%,#9C27B0 100%)}
  body{width:1000px;height:1000px;overflow:hidden;
    background:linear-gradient(140deg,#E91E63 0%,#C2185B 55%,#9C27B0 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Liberation Serif","DejaVu Serif",serif}
  /* everything sits inside the circle-crop safe zone (center ~68%) */
  .safe{width:680px;height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .glow{position:absolute;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%)}
  svg{width:340px;height:340px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.22))}
  .name{color:#fff;font-size:112px;font-weight:700;letter-spacing:-1px;line-height:1;
    text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.18);white-space:nowrap}
  .name small{display:block;font-family:"Liberation Sans","DejaVu Sans",sans-serif;
    font-size:30px;font-weight:700;letter-spacing:10px;margin-top:26px;opacity:.92}
</style></head><body>
  <div class="glow"></div>
  <div class="safe">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 34s-12.6-7.35-16.05-14.7C1.55 14.3 4.1 8.75 9.5 8.75c3.45 0 5.55 1.95 6.9 4.05L20 17.9l3.6-5.1c1.35-2.1 3.45-4.05 6.9-4.05 5.4 0 7.95 5.55 5.55 10.55C32.6 26.65 20 34 20 34z" fill="#fff"/>
    </svg>
    <div class="name">Able To Love<small>ABLE TO ASTONISH</small></div>
  </div>
</body></html>
