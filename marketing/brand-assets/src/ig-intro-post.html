<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  html{background:#0C1221}
  body{width:1080px;height:1080px;overflow:hidden;position:relative;
    background:linear-gradient(150deg,#0C1221 0%,#101729 48%,#1E2845 100%);
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center}
  .ghost{position:absolute;right:-120px;bottom:-140px;width:600px;height:600px;opacity:.06}
  .card{width:850px;text-align:left}
  .brandrow{display:flex;align-items:center;gap:20px;margin-bottom:64px}
  .brandrow svg{width:74px;height:74px}
  .brandname{font-size:38px;font-weight:700;letter-spacing:-.5px}
  h1{margin:0;font-size:88px;line-height:1.16;font-weight:700;letter-spacing:-2px}
  h1 .soft{color:#8FA2CC}
  .rule{width:150px;height:7px;border-radius:4px;margin:56px 0;
    background:linear-gradient(90deg,#426FAF,#E35C7B)}
  .cta{font-size:30px;font-weight:700;letter-spacing:4px;color:#8FA2CC}
</style></head><body>
  <svg class="ghost" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="#8FA2CC">
      <circle cx="63" cy="72" r="41"/>
      <circle cx="137" cy="72" r="41"/>
      <polygon points="25,88 175,88 100,172"/>
    </g>
  </svg>
  <div class="card">
    <div class="brandrow">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="hg" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="175">
            <stop offset="0" stop-color="#426FAF"/>
            <stop offset="0.5" stop-color="#936695"/>
            <stop offset="1" stop-color="#E35C7B"/>
          </linearGradient>
        </defs>
        <g fill="url(#hg)">
          <circle cx="63" cy="72" r="41"/>
          <circle cx="137" cy="72" r="41"/>
          <polygon points="25,88 175,88 100,172"/>
        </g>
      </svg>
      <div class="brandname">Able to Love</div>
    </div>
    <h1>Dating apps weren't built for us.<br><span class="soft">So we built one.</span></h1>
    <div class="rule"></div>
    <div class="cta">ABLE TO ASTONISH&nbsp;&nbsp;·&nbsp;&nbsp;WAITLIST IN BIO</div>
  </div>
</body></html>
