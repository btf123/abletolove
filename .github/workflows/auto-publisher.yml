name: Auto publisher (daily post)

on:
  schedule:
    - cron: '0 9 * * *' # every day 09:00 UTC, the peak slot
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish today's post to X and Instagram (official APIs)
        env:
          AUTOPOST: ${{ vars.AUTOPOST }}
          # Manual test runs post immediately; the real daily schedule keeps the
          # human-like delay so posts are never machine-timed on the dot.
          NO_JITTER: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node automation/publish-today.mjs

      - name: Commit the posting ledger
        if: always()
        run: |
          git config user.name "able2love-publisher"
          git config user.email "actions@github.com"
          git add content-queue/posted-log.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Posting ledger update [skip ci]"
            git push
          fi

      # A publisher that quietly posts nothing still reports success, which is
      # how a month of silence went unnoticed in August: week-2026-08-07 was
      # never released, so no batch covered the day and every run passed. This
      # notices the silence instead of the crash.
      - name: Say something if nothing has posted for days
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAYS=$(node -e "
            const fs = require('fs');
            let items = [];
            try {
              const log = JSON.parse(fs.readFileSync('content-queue/posted-log.json', 'utf8'));
              items = Array.isArray(log) ? log : (log.posts || log.log || []);
            } catch { }
            const last = items.map(e => e && e.date).filter(Boolean).sort().pop();
            console.log(last ? Math.floor((Date.now() - Date.parse(last)) / 86400000) : 999);
          ")
          echo "Days since the last post went out: $DAYS"
          if [ "$DAYS" -ge 3 ]; then
            OPEN=$(gh issue list --state open --search "Nothing has posted in:title" --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              gh issue create \
                --title "Nothing has posted for $DAYS days" \
                --body "The daily publisher has run and gone quiet for $DAYS days. It is not crashing, it is finding nothing to post. Almost always this means the newest week in content-queue is still waiting for Release (approved:false), or its dates have already passed. Open the dashboard and press Release on the current week: https://btf123.github.io/abletolove/dashboard/"
            else
              echo "Already flagged; not opening a second issue."
            fi
          fi

      - name: Raise the alarm if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Auto-publisher failed ($(date +%F))" \
            --body "Today's post did not go out cleanly. Check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The ledger in content-queue/posted-log.json shows what succeeded. Nothing will double-post on re-run."
