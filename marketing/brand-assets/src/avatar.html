<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  html{background:linear-gradient(135deg,#426FAF 0%,#936695 50%,#E35C7B 100%)}
  body{width:1000px;height:1000px;overflow:hidden;
    background:linear-gradient(135deg,#426FAF 0%,#936695 50%,#E35C7B 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Liberation Sans","DejaVu Sans",sans-serif}
  /* everything sits inside the circle-crop safe zone (center ~68%) */
  .safe{width:680px;height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  svg{width:400px;height:400px;filter:drop-shadow(0 12px 26px rgba(12,18,33,.28))}
  .name{color:#fff;font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1;
    text-align:center;margin-top:18px;text-shadow:0 3px 14px rgba(12,18,33,.25);white-space:nowrap}
  .tag{color:#fff;opacity:.85;font-size:29px;font-weight:700;letter-spacing:9px;margin-top:26px}
</style></head><body>
  <div class="safe">
    <!-- white version of the brand heart for contrast on the gradient -->
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g fill="#FFFFFF">
        <circle cx="63" cy="72" r="41"/>
        <circle cx="137" cy="72" r="41"/>
        <polygon points="25,88 175,88 100,172"/>
      </g>
    </svg>
    <div class="name">Able to Love</div>
    <div class="tag">ABLE TO ASTONISH</div>
  </div>
</body></html>
