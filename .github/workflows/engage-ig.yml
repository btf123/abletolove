name: Instagram comment replies

# Replies to comments on Able2Love's own Instagram posts, in voice, with safety
# rails. Does nothing unless the ENGAGE_REPLIES repo variable is set to "on"
# (the kill switch). Run manually with dry_run=true to preview with no posting.

on:
  schedule:
    - cron: '17 8,13,18 * * *' # three spaced check-ins a day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, post nothing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reply to new comments
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ENGAGE_REPLIES: ${{ vars.ENGAGE_REPLIES }}
        run: node automation/engage-ig.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit the engagement ledger
        run: |
          git config user.name "able2love-engage"
          git config user.email "actions@github.com"
          git add content-queue/engaged-log.json
          if git diff --cached --quiet; then
            echo "no ledger change"
          else
            git commit -m "Instagram engagement ledger [skip ci]"
            git push
          fi
