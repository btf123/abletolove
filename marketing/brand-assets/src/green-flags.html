<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  html{background:#16101B}
  body{width:1080px;height:1080px;overflow:hidden;position:relative;background:#16101B;
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;color:#fff;
    display:flex;flex-direction:column;justify-content:center;padding:0 84px;box-sizing:border-box}
  .brandrow{position:absolute;top:60px;left:84px;display:flex;align-items:center;gap:15px}
  .brandrow svg.mk{width:56px;height:56px}
  .brandname{font-size:29px;font-weight:700;letter-spacing:-.5px}

  /* red flag block */
  .redcard{background:#241820;border:1px solid #3A2731;border-radius:22px;padding:30px 34px;margin-bottom:44px}
  .rflabel{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#E86A6A;margin-bottom:16px}
  .rflabel svg{width:26px;height:30px}
  .bio{font-size:38px;font-weight:600;line-height:1.3;color:#F1E7EA}
  .aside{font-size:26px;color:#8A7A82;margin-top:12px;font-style:italic}

  /* green flags */
  .gflabel{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#5FD98C;margin-bottom:26px}
  .gflabel .dot{width:22px;height:22px;border-radius:50%;background:#5FD98C;display:inline-block}
  .flag{display:flex;align-items:flex-start;gap:22px;margin-bottom:22px}
  .flag svg{width:44px;height:44px;flex:none;margin-top:2px}
  .flag span{font-size:38px;font-weight:600;line-height:1.25}

  .foot{position:absolute;bottom:60px;left:84px;font-size:27px;font-weight:600;color:#F5798F}
</style></head><body>
  <div class="brandrow">
    <svg class="mk" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><clipPath id="lh"><rect x="0" y="0" width="512" height="1024"/></clipPath><clipPath id="rh"><rect x="512" y="0" width="512" height="1024"/></clipPath></defs>
      <path clip-path="url(#lh)" fill="#E23349" d="M512,865 C415,770 195,600 195,425 C195,305 285,230 375,230 C428,230 470,262 512,330 C554,262 596,230 649,230 C739,230 829,305 829,425 C829,600 609,770 512,865 Z"/>
      <path clip-path="url(#rh)" fill="#F5798F" d="M512,865 C415,770 195,600 195,425 C195,305 285,230 375,230 C428,230 470,262 512,330 C554,262 596,230 649,230 C739,230 829,305 829,425 C829,600 609,770 512,865 Z"/>
      <path fill="#16101B" d="M350,390 C430,435 594,435 675,390 C645,565 552,680 512,745 C472,680 379,565 350,390 Z"/>
      <circle cx="402" cy="285" r="123" fill="#16101B"/><circle cx="622" cy="285" r="123" fill="#16101B"/>
      <circle cx="402" cy="285" r="105" fill="#E23349"/><circle cx="622" cy="285" r="105" fill="#F5798F"/>
      <path fill="#F9C9D6" d="M512,615 C500,603 456,573 456,542 C456,522 471,511 487,511 C499,511 508,518 512,529 C516,518 525,511 537,511 C553,511 568,522 568,542 C568,573 524,603 512,615 Z"/>
    </svg>
    <div class="brandname">Able2Love</div>
  </div>

  <div class="redcard">
    <div class="rflabel">
      <svg viewBox="0 0 24 28" fill="none"><path d="M4 2v24" stroke="#E86A6A" stroke-width="2.5" stroke-linecap="round"/><path d="M4 3h15l-3 5 3 5H4z" fill="#E86A6A"/></svg>
      Red flag
    </div>
    <div class="bio">"Love to laugh, love to travel, no drama."</div>
    <div class="aside">A personality, or an airport?</div>
  </div>

  <div class="gflabel"><span class="dot"></span> Green flags only</div>
  <div class="flag">
    <svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="20" stroke="#5FD98C" stroke-width="3"/><path d="M13 22.5l6 6 12-13" stroke="#5FD98C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Asks instead of assumes</span>
  </div>
  <div class="flag">
    <svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="20" stroke="#5FD98C" stroke-width="3"/><path d="M13 22.5l6 6 12-13" stroke="#5FD98C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Doesn't treat access needs like a favour</span>
  </div>
  <div class="flag">
    <svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="20" stroke="#5FD98C" stroke-width="3"/><path d="M13 22.5l6 6 12-13" stroke="#5FD98C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Knows a wheelchair is freedom, not a tragedy</span>
  </div>

  <div class="foot">Write a better bio. Able2Love.</div>
</body></html>
