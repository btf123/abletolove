name: Content brain (weekly posts)

on:
  # SCHEDULE PAUSED 2026-07-28: the weekly auto-generator produced the old
  # stock-image direction, which kept superseding Brogan's new hand-made
  # direction (newer week folder = "latest") and filling the dashboard's
  # "Needs your eyes" with review issues. Re-enable this cron only once the
  # generator is updated to the new formats/photos. Manual runs still work via
  # the "Run workflow" button (workflow_dispatch) below.
  # schedule:
  #   - cron: '0 6 * * 1' # every Monday 06:00 UTC, well before the 09:00 publisher
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow + fonts for the reveal carousels
        run: |
          python -m pip install --quiet Pillow numpy imageio-ffmpeg
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install browser for image cards
        working-directory: automation
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate this week's aligned Instagram + X posts and cards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free key from https://www.pexels.com/api/ . If unset, photo cards
          # gracefully fall back to warm text cards, so this never breaks a run.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node automation/generate-week.mjs

      - name: Commit the batches
        id: commit
        run: |
          git config user.name "able2love-content-brain"
          git config user.email "actions@github.com"
          git add content-queue/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly post batch [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a review issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%F)
          BODY="body.md"
          echo "This week's Able2Love posts are ready to review. One subject a day, Instagram and X in tandem, same image both places." > "$BODY"
          echo "" >> "$BODY"
          echo "Card images are in \`content-queue/week-$DATE/\` in the repo." >> "$BODY"
          echo "" >> "$BODY"
          cat "content-queue/week-$DATE/schedule.md" >> "$BODY" 2>/dev/null || echo "(no batch generated)" >> "$BODY"
          gh issue create --title "Review this week's Able2Love posts ($DATE)" --body-file "$BODY"
