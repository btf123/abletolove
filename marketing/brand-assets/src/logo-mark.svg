<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Able to Love official mark: two figures, heads touching, forming a heart -->
  <defs>
    <clipPath id="leftHalf"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="rightHalf"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <!-- outer heart lobes, split into the two figure colours -->
  <g>
    <path clip-path="url(#leftHalf)" fill="#E23349" d="M512,865 C415,770 195,600 195,425 C195,305 285,230 375,230 C428,230 470,262 512,330 C554,262 596,230 649,230 C739,230 829,305 829,425 C829,600 609,770 512,865 Z"/>
    <path clip-path="url(#rightHalf)" fill="#F5798F" d="M512,865 C415,770 195,600 195,425 C195,305 285,230 375,230 C428,230 470,262 512,330 C554,262 596,230 649,230 C739,230 829,305 829,425 C829,600 609,770 512,865 Z"/>
  </g>
  <!-- inner hollow (negative space chevron) -->
  <path fill="#16101B" d="M350,390 C430,435 594,435 675,390 C645,565 552,680 512,745 C472,680 379,565 350,390 Z"/>
  <!-- gap rings around the heads -->
  <circle cx="402" cy="285" r="123" fill="#16101B"/>
  <circle cx="622" cy="285" r="123" fill="#16101B"/>
  <!-- the heads -->
  <circle cx="402" cy="285" r="105" fill="#E23349"/>
  <circle cx="622" cy="285" r="105" fill="#F5798F"/>
  <!-- small heart between the figures -->
  <path fill="#F9C9D6" d="M512,615 C500,603 456,573 456,542 C456,522 471,511 487,511 C499,511 508,518 512,529 C516,518 525,511 537,511 C553,511 568,522 568,542 C568,573 524,603 512,615 Z"/>
</svg>
