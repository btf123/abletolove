<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  html{background:#0C1221}
  body{width:1500px;height:500px;overflow:hidden;position:relative;
    background:linear-gradient(115deg,#0C1221 0%,#101729 45%,#1E2845 100%);
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center}
  /* faint oversize brand heart, echoing the store feature graphic */
  .ghost{position:absolute;right:-60px;top:-90px;width:520px;height:520px;opacity:.07}
  .lockup{display:flex;align-items:center;gap:56px}
  .mark{width:240px;height:240px}
  h1{margin:0;font-size:110px;font-weight:700;letter-spacing:-2px;line-height:1}
  .tagline{margin-top:22px;font-size:44px;font-weight:400;letter-spacing:.5px;color:#8FA2CC}
</style></head><body>
  <svg class="ghost" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="#8FA2CC">
      <circle cx="63" cy="72" r="41"/>
      <circle cx="137" cy="72" r="41"/>
      <polygon points="25,88 175,88 100,172"/>
    </g>
  </svg>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="hg" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="175">
          <stop offset="0" stop-color="#426FAF"/>
          <stop offset="0.5" stop-color="#936695"/>
          <stop offset="1" stop-color="#E35C7B"/>
        </linearGradient>
      </defs>
      <g fill="url(#hg)">
        <circle cx="63" cy="72" r="41"/>
        <circle cx="137" cy="72" r="41"/>
        <polygon points="25,88 175,88 100,172"/>
      </g>
    </svg>
    <div>
      <h1>Able to Love</h1>
      <div class="tagline">Able to astonish</div>
    </div>
  </div>
</body></html>
